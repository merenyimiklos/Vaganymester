name: VAGANYMESTER Android APK

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # Native templates are generated because the Windows WPF source is
      # retained independently and the cross-platform app lives in mobile/.
      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --org hu.merenyimiklos --project-name vaganymester .

      - name: Force Android landscape orientation
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          old = 'android:name=".MainActivity"'
          assert old in source, "MainActivity declaration not found"
          manifest.write_text(source.replace(
              old, old + ' android:screenOrientation="sensorLandscape"'))
          PY

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Static analysis
        working-directory: mobile
        run: flutter analyze

      - name: Run simulation tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --build-name 0.4.0 --build-number ${{ github.run_number }}

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Vaganymester-Android-APK-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
